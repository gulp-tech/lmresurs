name: build-voidplugins

# Сборка исправленных и оптимизированных плагинов VoidPE.
# Запуск: вручную (Actions -> build-voidplugins -> Run workflow) или пушем
# изменений в plugins/**. Готовые jar-файлы кладутся в релиз "voidplugins".

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/**'
      - '.github/workflows/build-plugins.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - VoidAntiCheat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Версии инструментов
        run: |
          java -version
          mvn -version

      - name: Сборка ${{ matrix.plugin }}
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          set -o pipefail
          mvn -B -DskipTests package 2>&1 | tee build.log

      # Логи прогона недоступны снаружи, поэтому ошибки сборки выносим в
      # аннотации — они видны в интерфейсе Actions и через API.
      - name: Ошибки сборки в аннотации
        if: failure()
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          if [ -f build.log ]; then
            grep -E "^\[ERROR\]|error:|BUILD FAILURE|Could not resolve" build.log | head -25 | sed 's/^/::error::/'
            echo "---- последние строки ----"
            tail -40 build.log
          fi

      - name: Проверка jar
        working-directory: plugins/${{ matrix.plugin }}
        run: ls -la target/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-jar
          path: plugins/${{ matrix.plugin }}/target/*.jar
          if-no-files-found: error
