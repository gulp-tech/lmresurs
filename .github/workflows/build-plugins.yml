name: build-voidplugins

# Сборка всех плагинов VoidPE под Paper 26.2 (Java 25).
# Запуск: вручную (Actions -> build-voidplugins -> Run workflow) или пушем
# изменений в plugins/**. Готовые jar-файлы уходят в релиз "voidplugins".

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugins/**'
      - 'docs/PLUGINS_FIX_AND_TUNING.md'
      - '.github/workflows/build-plugins.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - VoidAntiCheat
          - VoidAuthSpawn
          - VoidCases
          - VoidClans
          - VoidCombat
          - VoidDrops
          - VoidEnchants
          - VoidItems
          - VoidNick
          - VoidPvP
          - VoidQuiet
          - VoidTab
          - VoidTalismans
          - VoidWardenCity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Сборка ${{ matrix.plugin }}
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          set -o pipefail
          mvn -B -DskipTests package 2>&1 | tee build.log

      - name: Ошибки сборки в аннотации
        if: failure()
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          if [ -f build.log ]; then
            grep -E "^\[ERROR\]|error:|BUILD FAILURE|Could not resolve" build.log | head -25 | sed 's/^/::error::/'
            echo "---- последние строки ----"
            tail -40 build.log
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.plugin }}-jar
          path: plugins/${{ matrix.plugin }}/target/*.jar
          if-no-files-found: error

  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Собрать архив с конфигами и jar-ами
        run: |
          mkdir -p upload/configs upload/jars
          cp -r plugins/configs/. upload/configs/
          cp docs/PLUGINS_FIX_AND_TUNING.md upload/ 2>/dev/null || true
          cp jars/*.jar upload/jars/
          (cd upload && zip -r ../voidplugins-all.zip .)
          ls -la upload/jars

      - name: Публикация в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=voidplugins
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "VoidPE plugins: сборки под Paper 26.2" --notes "Автосборка из plugins/."
          fi
          gh release upload "$TAG" jars/*.jar voidplugins-all.zip --clobber
