# ============================================================
# VoidQuiet — тишина в чате: вход, выход, смерти.
# Всё настраивается здесь, код трогать не нужно.
# После правок: /voidquiet reload
# ============================================================

# Главный выключатель: false — плагин ничего не делает.
enabled: true

# ------------------------------------------------------------
# Вход на сервер
# ------------------------------------------------------------
join:
  # true — сообщений «X зашёл на сервер» не будет вообще.
  hide: true

  # Своё сообщение вместо стандартного. Пусто "" — значит скрыть совсем.
  # Плейсхолдеры: {player} — ник с префиксом/значками, {username} — чистый ник,
  #               {online} — сколько игроков сейчас онлайн.
  # Пример: '&8» &a{username} &7зашёл на сервер'
  message: ""

# ------------------------------------------------------------
# Выход с сервера
# ------------------------------------------------------------
quit:
  hide: true
  # Плейсхолдеры те же: {player} {username} {online}
  message: ""

# ------------------------------------------------------------
# Смерти и убийства
# ------------------------------------------------------------
death:
  # true — сообщений «X погиб» / «X убит Y» не будет.
  hide: true

  # Своё сообщение вместо стандартного. Пусто "" — скрыть совсем.
  # Плейсхолдеры: {player} {username} {killer} {weapon} {world}
  # Пример: '&8» &c{username} &7пал от руки &c{killer}'
  message: ""

  # Выставить ванильный геймрул showDeathMessages=false во всех мирах.
  # Нужен, потому что часть сообщений о смерти шлёт не плагин, а само ядро.
  # true — плагин сам пропишет геймрул при старте и при загрузке новых миров.
  disable-gamerule: true

# ------------------------------------------------------------
# Где работает
# ------------------------------------------------------------
worlds:
  # Миры, где сообщения НЕ скрываются (например, лобби или арена).
  # Пример: [world_lobby]
  disabled: []

# ------------------------------------------------------------
# Сообщения плагина (ответы на команду)
# ------------------------------------------------------------
messages:
  prefix: "&#FFD93DVoidQuiet &8» &7"
  reloaded: "&aКонфиг перезагружен."
  gamerule-done: "&7Геймрул showDeathMessages выключен в мирах: &e%worlds%"
  no-permission: "&cНедостаточно прав."
