# ============================================================
#  VoidCombat — PvP-режим (режим боя) сервера VoidPE (Bedrock)
#
#  Игрок входит в режим боя, когда наносит или получает PvP-урон.
#  Пока режим боя активен:
#   - золотые яблоки, зелья исцеления и кастомные предметы
#     используются с кулдаунами ниже;
#   - фейерверки запрещены полностью (и для элитр, и в арбалете).
#
#  УПРАВЛЕНИЕ КОМАНДАМИ (админ, право voidcombat.admin):
#   /combat off | on          — выключить/включить режим боя
#   /combat settime <сек>     — длительность режима боя
#   /combat world add [мир]   — безопасный мир (без режима боя)
#   /combat zone add <имя> [радиус] — безопасная зона вокруг тебя
#   /combat info              — текущие настройки
#  Командные настройки пишутся в state.yml и не слетают при
#  перезапуске и обновлении этого конфига.
#
#  Цвета: &a, &#FFB340 и <gradient:#FF5555:#FFB340>текст</gradient>
# ============================================================

combat:
  # Включён ли режим боя. Можно выключить и командой /combat off
  # (команда главнее: её выбор хранится в state.yml).
  enabled: true
  # Сколько секунд держится режим боя после последнего PvP-урона.
  # Меняется и командой: /combat settime <сек>
  duration-seconds: 30
  # Не ставить метку боя, если участник в креативе или наблюдателе.
  ignore-creative-and-spectator: true

  # Безопасные места: режим боя там НЕ ставится, а уже активная
  # метка снимается (clear-on-enter). Миры и зоны также добавляются
  # командами /combat world и /combat zone (пишутся в state.yml).
  safe:
    # Миры без режима боя (имена миров).
    worlds: []
    # Регионы WorldGuard без режима боя (id регионов).
    worldguard-regions: []
    # Снимать метку боя при входе в безопасное место.
    clear-on-enter: true
    # Радиус зоны по умолчанию для /combat zone add без радиуса.
    default-zone-radius: 30
    # Зоны-команды проверяются только по горизонтали (игнорируя высоту).
    ignore-y: true

  display:
    # Боссбар сверху экрана, пока игрок в бою: заголовок с обратным
    # отсчётом и полоса, которая тает по мере окончания режима боя.
    # На Bedrock через Geyser виден отлично (в отличие от actionbar).
    bossbar: true
    # Текст боссбара: {seconds} — осталось секунд.
    bossbar-format: "&#FF5555Режим боя: &f{seconds} сек."
    # Цвет боссбара: RED, PINK, BLUE, GREEN, YELLOW, PURPLE, WHITE.
    bossbar-color: RED
    # Стиль полосы: PROGRESS (сплошная) или NOTCHED_6, NOTCHED_10,
    # NOTCHED_12, NOTCHED_20 (с делениями).
    bossbar-overlay: PROGRESS
    # Показывать оставшееся время над хотбаром каждую секунду.
    actionbar: true
    # Текст в actionbar: {seconds} — осталось секунд, {bar} — полоса.
    actionbar-format: "&#FF5555Режим боя: &f{seconds} сек. &8[{bar}&8]"
    # Полоса прогресса в actionbar.
    bar-length: 10
    bar-filled: "█"
    bar-empty: "░"

cooldowns:
  enabled: true
  # true — кулдауны работают только пока игрок в режиме боя.
  # false — кулдауны ниже действуют всегда.
  only-in-combat: true

  # Обычные предметы (секунды).
  vanilla:
    golden-apple: 30
    enchanted-golden-apple: 180
    # Питьевые, взрывные и оседающие зелья исцеления.
    healing-potion: 15

  # Предметы VoidItems (узнаются по скрытой метке плагина).
  custom-items:
    enabled: true
    # Кастомный предмет нельзя поставить на кулдаун меньше этого значения,
    # если его кулдаун больше нуля.
    minimum-seconds: 60
    # Кулдаун, если для конкретного id ниже ничего не указано.
    default-seconds: 60
    items:
      trapka: 60
      dust: 60
      dezorientation: 60
      spawner_lom: 60
      pot_berserk: 60
      pot_warrior: 60
      pot_runner: 60
      pot_tank: 60
    # Активные предметы: плагин замечает успешное использование и только
    # тогда включает кулдаун. Кастомные зелья VoidItems включаются сюда
    # автоматически при питье, даже если их id нет в списке.
    tracked-ids:
      - trapka
      - dust
      - dezorientation
      - spawner_lom

elytra:
  # Миры, где элитры запрещены полностью: взлететь нельзя, ускорение фейерверком
  # не работает. Игрок, влетевший в такой мир на элитре, сразу опускается на землю.
  banned-worlds: [world]

fireworks:
  # Запрещать фейерверки всеми способами, пока игрок в режиме боя:
  # запуск рукой, ускорение на элитрах и выстрел из арбалета.
  block-in-combat: true
  # Миры, где фейерверки запрещены всегда, даже вне боя (рука, элитра, арбалет).
  banned-worlds: [world]

