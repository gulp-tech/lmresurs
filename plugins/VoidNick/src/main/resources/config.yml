# ============================================================
#  VoidNick — смена ника «с нуля» для VoidPE (Bedrock)
#
#  Идея: игрок хочет начать заново под другим ником. Плагин
#  переименовывает его везде, где это видит сервер, и снимает
#  всё, что делало его «старым игроком»: OP, группы LuckPerms,
#  деньги, инвентарь, статистику. Всё записывается в журнал,
#  откат возвращает состояние назад.
#
#  КОМАНДЫ ТОЛЬКО ИЗ КОНСОЛИ (в игре прав нет):
#    /voidnick set <старый> <новый>   переименовать
#    /voidnick revert <ник>           вернуть всё как было
#    /voidnick info <ник>             что записано по игроку
#    /voidnick list                   все переименованные
#    /voidnick history [ник]          журнал действий
#    /voidnick reload                 перечитать конфиг
#
#  ВАЖНО: прокси нет, игроки заходят через Geyser-Spigot.
#  Настоящее имя аккаунта (UUID) поменять нельзя — плагин
#  подменяет ник на сервере: чат, таб-лист, скорборд (команды
#  и очки), сообщения входа/выхода. В F3 и в логах ядра
#  останется настоящее имя аккаунта.
# ============================================================

enabled: true

# Папка какого мира хранит playerdata/, stats/ и advancements/.
# Пусто — берётся первый загруженный мир сервера.
world: ""

# ------------------------------------------------------------
# Что сбрасывается при смене ника («стал новым игроком»)
# Всё сброшенное сохраняется в plugins/VoidNick/archives
# и возвращается командой /voidnick revert.
# ------------------------------------------------------------
reset:
  # Снять OP.
  op: true

  # Очистить группы и права LuckPerms (нужна установленная LuckPerms).
  # Ставится группа по умолчанию — та, что указана ниже.
  luckperms: true
  default-group: "default"

  # Обнулить баланс (нужен Vault + любой экономический плагин).
  economy: true

  # Инвентарь, эндер-сундук, эффекты, опыт — файл playerdata.
  playerdata: true

  # Статистика (наработка, убийства, добытые блоки).
  stats: true

  # Достижения.
  advancements: true

  # Дополнительные команды от консоли при смене ника.
  # %player% — НАСТОЯЩИЙ ник игрока (он не меняется, по нему и работают команды).
  # Примеры:
  #   - "essentials:delhome %player% *"
  #   - "points set %player% 0"
  #   - "tpahere %player%"
  commands: []

  # Команды при откате (выполняются после возврата данных и прав).
  restore-commands: []

# ------------------------------------------------------------
# Поведение
# ------------------------------------------------------------
rename:
  # Раз в сколько тиков обновлять ник в таб-листе.
  # Другие плагины иногда перезаписывают его — тогда ник «отваливается».
  refresh-ticks: 40

  # Требовать, чтобы игрок был офлайн (так безопаснее: файлы playerdata
  # нельзя переносить у играющего игрока).
  require-offline: true

  # Минимальная и максимальная длина нового ника.
  min-length: 3
  max-length: 16

# ------------------------------------------------------------
# Сообщения (цвета: &a, &#RRGGBB)
# ------------------------------------------------------------
messages:
  prefix: "&#8E6BFFVoidNick &8» &f"
  no-permission: "&cКоманды VoidNick работают только из консоли сервера."
  unknown-player: "&cИгрок &f%player% &cне найден (ни разу не заходил?)."
  player-online: "&cИгрок &f%player% &cсейчас в игре. Попроси его выйти и повтори — данные нельзя переносить у играющего."
  invalid-name: "&cНик может содержать только латиницу, цифры, _ и точку (3–16 символов)."
  name-taken: "&cНик &f%player% &cуже занят другим аккаунтом."
  already-renamed: "&cЭтот игрок уже переименован. Сначала &f/voidnick revert %player%&c."
  not-renamed: "&cИгрок &f%player% &cне переименован."
  renamed: "&aГотово: &f%old% &aтеперь &f%new%&a. Права и данные сброшены, всё записано в журнал."
  reverted: "&aОткат выполнен: &f%player% &aснова &f%original%&a, права и данные возвращены."
  list-empty: "&7Переименованных игроков нет."
  list-header: "&fПереименованные игроки (&e%count%&f):"
  list-line: "&8• &f%original% &7→ &e%new% &8(&7%date%&8)"
  info-header: "&fЗапись по игроку &e%player%&f:"
  info-line: "&8• &7%key%: &f%value%"
  reloaded: "&aКонфиг перечитан."
  usage: "&7/voidnick set <старый> <новый> | revert <ник> | info <ник> | list | history [ник] | reload"
  history-header: "&fЖурнал (&e%count%&f последних записей):"
  economy-unavailable: "&7Vault/экономика не найдены — баланс не записан и не обнулён."
  luckperms-unavailable: "&7LuckPerms не найдены — группы не записаны и не сброшены."

# Что писать в чат при входе/выходе (false — молчать, как сейчас делает VoidQuiet).
join-quit:
  enabled: false
  join: "&8[&a+&8] &f%player%"
  quit: "&8[&c-&8] &f%player%"

# Формат чата для переименованного игрока: %player% — его новый ник.
chat:
  format: "&f%player% &8» &7"
