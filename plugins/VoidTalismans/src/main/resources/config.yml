# ============================================================
#  VoidTalismans — талисманы и сферы для Bedrock (VoidPE)
#
#  КАК РАБОТАЕТ: талисман работает ТОЛЬКО в левой руке (вторая рука).
#  Лежит в инвентаре или хотбаре — ничего не даёт, ноль эффектов.
#  плюсы и минусы. Убрал — всё пропало. Магазина нет: талисманы
#  выдаёт админ: команда /talisman, клик по талисману в меню.
#
#  ПОД BEDROCK: тут только характеристики, которые есть в Bedrock —
#  урон, защита, здоровье и скорость. "Твёрдости брони" и "скорости
#  атаки" в Bedrock нет (кулдауна ударов там нет), поэтому в
#  стандартных талисманах их нет и в лоре не пишется лишнего.
#
#  НАСТРАИВАЕТСЯ ВСЁ: названия, предметы, лор, плюсы/минусы, цены,
#  место, права, крафт, все тексты и звуки. Отключить талисман —
#  enabled: false. Добавить свой — скопируй любой блок, дай новый id.
#  После правок: /talisman reload. Старый config.yml сам НЕ
#  перезапишется — при обновлении плагина удали старый файл конфига.
#
#  Цвета: &a, &#FFB340, <gradient:#55C8FF:#1B6FFF>текст</gradient>
#  В лоре: {stats} — плюсы/минусы списком (больше ничего не пишем).
#  Талисман узнаётся по скрытой метке, переименованием не подделать.
# ============================================================

settings:
  # Как часто проверять инвентари, в тиках (20 = 1 сек).
  refresh-interval-ticks: 40
  # Сколько талисманов работает одновременно (0 = сколько угодно).
  max-active-talismans: 0
  # Сами дописывать плюсы/минусы в лор, если в лоре нет {stats}.
  auto-stats-lore: true
  # Цвета плюсов и минусов в лоре.
  stat-plus-color: "&a"
  stat-minus-color: "&c"
  # Частицы эффектов (на Bedrock их не видно, лучше выкл).
  effect-particles: false
  # Показывать активные талисманы над хотбаром.
  show-actionbar: false

# Как характеристики называются в лоре. attack_speed и armor_toughness
# оставлены на всякий случай, но в Bedrock их нет — в стандартных
# талисманах не используются.
stat-names:
  attack_damage: "к урону"
  armor: "к защите"
  max_health: "к здоровью"
  movement_speed: "к скорости"
  knockback_resistance: "к откидыванию"
  luck: "к удаче"
  attack_speed: "к скорости атаки"
  armor_toughness: "к твёрдости брони"

# Названия эффектов в лоре (если дашь талисману effects).
effect-names:
  strength: "Сила"
  speed: "Скорость"
  haste: "Спешка"
  regeneration: "Регенерация"
  resistance: "Защита"
  fire_resistance: "Огнестойкость"
  health_boost: "Здоровье"
  jump_boost: "Прыжки"
  night_vision: "Видеть в темноте"
  saturation: "Сытость"

menu:
  title: "&#C86BFFТалисманы"
  rows: 4

messages:
  prefix: "&#C86BFFVoidPE &8» &f"
  reloaded: "&aКонфиг перезагружен."
  no-permission: "&cТолько для админов."
  player-not-found: "&cИгрок не найден."
  not-found: "&cТакого талисмана нет. Список: &f/talisman list"
  received: "&aТы получил: &f{talisman}&a!"
  exchange-no-item: "&cДля обмена нужно: &fяйцо дракона&c. Сфера не выдана."
  exchange-success: "&aОбмен завершён! Ты получил: &f{talisman}&a!"
  given: "&aВыдано игроку {player}: &f{talisman} &7x{amount}"
  help:
    - "&f/talisman &7— меню талисманов и сфер"
    - "&f/talisman give <игрок> <id> [кол-во] &7— выдать (работает из консоли)"
    - "&f/talisman list &7— список всех id"
    - "&f/talisman reload &7— перезагрузить конфиг"

# ------------------------------------------------------------
#  ТАЛИСМАНЫ
#  id (crusher и т.д.) — внутренний номер талисмана, игрокам не виден. НЕ меняй id, если
#  талисманы уже выданы игрокам: по id плагин узнаёт предметы.
#  Менять можно всё остальное: название, предмет, цифры, цену.
#
#  attributes: amount у ADD_NUMBER — просто число (здоровье в HP:
#  +2 = одно сердце), у ADD_SCALAR — доля (0.10 = +10%).
#  where: OFFHAND — только в левой руке (так сейчас у всех) |
#         INVENTORY — в инвентаре | HOTBAR — в хотбаре.
#  recipe — крафт на верстаке (enabled: true + shape + ingredients).
# ------------------------------------------------------------
# Обмен в магазине сфер: яйцо дракона -> сфера пустоты одной командой
# /sphere exchange <игрок> (плагин сам проверяет и забирает яйцо).
sphere-exchange:
  material: DRAGON_EGG
  amount: 1
  give: sphere4

