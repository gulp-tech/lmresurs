# ============================================================
# VoidPvP — fast crits для VoidPE
# Всё настраивается здесь, код трогать не нужно.
# После изменений: /voidpvp reload
# ============================================================

# Версия конфига: по ней плагин понимает, что файл на сервере старый и его надо обновить.
config-version: 3

# Главный выключатель: false — плагин ничего не делает.
enabled: true

# ------------------------------------------------------------
# Криты
# ------------------------------------------------------------
crits:
  enabled: true

  # Крит при ударе в прыжке или в падении.
  # В ваниле спринт-прыжок крит НЕ даёт (спринт отменяет крит) — здесь даёт.
  while-airborne: true

  # Крит на любой удар, даже стоя на земле (режим «всё криты»).
  # false — криты только в воздухе, как в обычной игре.
  always: false

  # Множитель урона крита. Ванильный крит — 1.5, поэтому здесь меньше:
  # крит остаётся, но бой не заканчивается с одного-двух ударов.
  # Вернуть прежнюю жёсткость — 1.5 (и выше).
  multiplier: 1.15

  # Показывать частицы крита и играть звук — чтобы игрок видел, что крит прошёл.
  particles: true
  sound: true

  # Не считать критом удары по этим сущностям (например, по стойкам для брони).
  ignored-entities:
    - ARMOR_STAND
    - ITEM_FRAME
    - PAINTING

# ------------------------------------------------------------
# Задержка атаки (attack cooldown)
# ------------------------------------------------------------
attack-speed:
  # true — задержка атаки убрана: удар всегда наносит полный урон,
  # можно бить так часто, как успеваешь (режим 1.8).
  enabled: true

  # Значение атрибута ATTACK_SPEED. Чем больше — тем короче задержка.
  # 6.5 — с мечом полный удар раз в 5 тиков (0.25 сек): «тап-тап» работает,
  # но серия кликов не выдаёт максимальный урон каждый тик. Ваниль с мечом — 1.6 (0.625 сек).
  # 1024 — задержки практически нет (прежний, самый жёсткий режим).
  value: 6.5

  # Как часто переприменять значение, в тиках (40 = раз в 2 секунды).
  # Нужно на случай, если другой плагин или ядро пересоберут атрибуты игрока:
  # без этого задержка атаки возвращается «сама собой».
  refresh-ticks: 40

# ------------------------------------------------------------
# Неуязвимость между ударами (0.5 сек в ваниле)
# ------------------------------------------------------------
no-invulnerability:
  # true — каждый удар наносит урон, даже если предыдущий был 0.2 сек назад.
  # Это и есть «тап-тап»: сколько раз попал, столько раз и прошло.
  # Снимается только после удара игрока по живому существу — урон от огня,
  # лавы, зелий и падений остаётся обычным.
  enabled: true

  # Минимальный интервал между ударами, которые снимают неуязвимость (тики).
  # 4 = не чаще 5 ударов в секунду. 0 — снимать всегда (самый жёсткий режим).
  # Это страховка на случай, если другой плагин или ядро вернут атрибут атаки.
  min-interval-ticks: 4

# ------------------------------------------------------------
# Ослабление «тап-тап» (23.10.2026)
# ------------------------------------------------------------
tap-tap:
  # Удар, пришедший раньше этого окна после предыдущего, считается повторным (тики).
  # 10 тиков = 0.5 сек.
  repeat-window-ticks: 10

  # Множитель урона повторного удара внутри окна. 1.0 — не ослаблять.
  # 0.65 — серия кликов бьёт на 35% слабее, одиночный удар не меняется.
  repeat-damage-scale: 0.65

  # Отдача (knockback) от ударов игрока по игроку. 1.0 — ванильная.
  knockback-scale: 0.5

  # Дополнительный множитель отдачи именно для повторных ударов
  # (итого 0.5 × 0.3 = 0.15 от ванильной — игрока не уносит через полкарты).
  repeat-knockback-scale: 0.3

# ------------------------------------------------------------
# Где работает
# ------------------------------------------------------------
worlds:
  # Миры, где система выключена. Пример: [world_creative, world2]
  disabled: []

# ------------------------------------------------------------
# Права
# ------------------------------------------------------------
permissions:
  # Право на fast crits. Пусто ("") — работает у всех.
  # Пример: "voidpvp.fastcrits" — тогда выдавать группам LuckPerms:
  #   lp group <группа> permission set voidpvp.fastcrits true
  require: ""

  # Право, которое отключает fast crits у игрока (перебивает require).
  bypass-off: "voidpvp.off"

# ------------------------------------------------------------
# Сообщения
# ------------------------------------------------------------
messages:
  prefix: "&#FFD93DVoidPvP &8» &7"
  reloaded: "&aКонфиг перезагружен."
  status-header: "&fСостояние &e%state%"
  status-crits: "&7Криты: %airborne% &8| &7всегда: %always% &8| &7множитель: &e%multiplier%"
  status-cooldown: "&7Задержка атаки убрана: %attack% &8| &7нет неуязвимости: %invuln%"
  no-permission: "&cНедостаточно прав."
