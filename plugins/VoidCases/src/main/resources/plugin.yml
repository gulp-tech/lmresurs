name: VoidCases
version: '${project.version}'
main: ru.voidpe.cases.VoidCases
api-version: '26.2'
author: VoidPE
description: "Донат-кейсы: титулы (LuckPerms) и осколки (PlayerPoints). Анимация-рулетка и объявления о выигрыше. Всё настраивается в config.yml."
softdepend: [LuckPerms, PlayerPoints]
commands:
  cases:
    description: "Кейсы VoidPE"
    usage: /cases
    aliases: [case, кейсы]
    permission: voidcases.use
  titles:
    description: "Меню титулов из кейса титулов: установка имеющихся и снятие титула"
    usage: /titles
permissions:
  voidcases.use:
    description: Игровые команды кейсов (открытие и список)
    default: true
  voidcases.admin:
    description: Выдача кейсов и перезагрузка VoidCases
    default: op
