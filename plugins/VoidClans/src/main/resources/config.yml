# ============================================================
#  VoidClans — кланы (VoidPE, Bedrock)
#
#  /clan — меню клана. Деньги клана — монеты Vault.
#  Роли и их права настраиваются прямо в игре: меню клана ->
#  "Роли и права" или /clan setperm <роль> <право>.
#  Права: invite (приглашать), kick (кикать), withdraw (снимать
#  монеты из банка), promote (выдавать роли ниже своей),
#  settings (настраивать права ролей), sethome (ставить дом).
#  У Лидера всегда все права. Данные: plugins/VoidClans/clans.yml
# ============================================================

settings:
  create-cost: 10000        # цена создания клана (монеты Vault), 0 — бесплатно
  max-members: 20           # максимум игроков в клане
  name-min: 3
  name-max: 16
  invite-expire-seconds: 120
  home-warmup-seconds: 3    # прогрев телепорта домой (сек), 0 — мгновенно; движение отменяет

# Прокачка клана: опыт за действия участников.
leveling:
  xp:
    block-break: 1       # сломанный блок (не в креативе)
    mob-kill: 2          # убийство моба
    player-kill: 25      # убийство игрока
    fish: 5              # пойманная рыба

# Уровни клана: xp — сколько ВСЕГО опыта нужно для уровня,
# members — слоты игроков, bank — лимит казны (-1 — без лимита),
# homes — точек клан-дома. Уровень 1 — стартовый.
levels:
  1:  { xp: 0,     members: 5,  bank: 50000,   homes: 1 }
  2:  { xp: 500,   members: 8,  bank: 100000,  homes: 1 }
  3:  { xp: 1500,  members: 10, bank: 200000,  homes: 1 }
  4:  { xp: 3000,  members: 12, bank: 350000,  homes: 1 }
  5:  { xp: 5000,  members: 15, bank: 500000,  homes: 1 }
  6:  { xp: 8000,  members: 18, bank: 750000,  homes: 1 }
  7:  { xp: 12000, members: 20, bank: 1000000, homes: 1 }
  8:  { xp: 18000, members: 23, bank: 1500000, homes: 1 }
  9:  { xp: 26000, members: 26, bank: 2500000, homes: 1 }
  10: { xp: 40000, members: 30, bank: -1,      homes: 2 }

# Роли: priority — чем выше, тем главнее (кикать/менять роли можно
# только игрокам с приоритетом ниже своего). permissions — права
# по умолчанию для НОВЫХ кланов; дальше каждый клан настраивает сам.
roles:
  leader:
    name: "&#FFD93DЛидер"
    priority: 100
    permissions: [invite, kick, withdraw, promote, settings, sethome]
  deputy:
    name: "&#FF9A3DЗаместитель"
    priority: 80
    permissions: [invite, kick, withdraw, promote, sethome]
  officer:
    name: "&#8CE8FFОфицер"
    priority: 50
    permissions: [invite]
  member:
    name: "&7Боец"
    priority: 10
    permissions: []
default-role: member        # роль новых участников

# Плейсхолдеры PlaceholderAPI для ChatEx и других плагинов:
# %voidclans_tag% — готовый цветной тег клана, %voidclans_name% — просто название.
# Полный список: tag, name, role, role_id, leader, level, xp, bank,
# members, members_online, max_members, homes, has_clan, is_leader.
placeholders:
  tag-format: "&8[&#C86BFF{clan}&8]&r"  # &r в конце: тег не красит ник дальше
  no-clan: ""                            # что вернёт %voidclans_name%, если клана нет

menu:
  title: "&#C86BFFКлан"
  title-none: "&#C86BFFКланы"
  amounts: [100, 1000, 10000]   # кнопки сумм в банке (последняя — "всё")

