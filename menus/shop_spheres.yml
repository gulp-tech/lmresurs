      - '[console] points take %player_name% 1300'
      - '[console] sphere give %player_name% 1 1'
      - '[message] &#7CFC00Покупка успешна: &#C86BFFСфера сумерек'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

