      - '&7Твой баланс: &#54C8FF%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '1300'
      deny_commands:
        - '[message] &#FF6B6BНе хватает осколков: нужно 1300, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
