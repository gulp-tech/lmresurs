  'Сфера сумерек':
    slots:
    - 20
    material: PAPER
    item_model: voidspheres:sphere1
    model_data_component:
      floats: [9001.0]
    display_name: '&#C86BFFСфера сумерек'
    lore:
      - ''
      - '&7Работает только в левой руке.'
      - ''
      - '&7Урон: &a+1'
      - '&7Броня: &a+1'
      - '&7Здоровье: &a+2'
      - ''
