      - '&7Сферы трёх уровней: сумерек,'
      - '&7пламени и бездны. Тоже в левую руку.'
      - ''
      - '&eНажми, чтобы открыть раздел'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_spheres'

  'Раздел зачарования':
    slots:
    - 33
    material: ENCHANTED_BOOK
    display_name: '&dКастомные зачарования'
    lore:
      - ''
      - '&7Книги: Автоплавка, Магнит и Бур.'
      - '&7Накладываются на инструмент на наковальне.'
