    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '

  'Баланс':
    slots:
    - 13
    material: PRISMARINE_SHARD
    display_name: '&bТвои осколки'
    lore:
      - ''
      - '&fБаланс: &b%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Раздел предметы':
    slots:
    - 20
    material: CHEST
    display_name: '&dКастомные предметы'
    lore:
      - ''
      - '&7Капкан, пыль обнаружения, око'
      - '&7дезориентации и лом для спавнеров.'
      - ''
      - '&eНажми, чтобы открыть раздел'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_items'

  'Раздел зелья':
    slots:
    - 22
    material: POTION
    display_name: '&cЗелья'
    lore:
      - ''
      - '&7Особые зелья: ярость, боевое,'
      - '&7скорости и защиты.'
      - ''
      - '&eНажми, чтобы открыть раздел'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_potions'

  'Раздел кирки':
    slots:
    - 24
    material: NETHERITE_PICKAXE
    display_name: '&6Кирки'
    lore:
      - ''
      - '&7Кирки шахтёра I, II и III:'
      - '&7Автоплавка, Магнит и Бур.'
      - ''
      - '&eНажми, чтобы открыть раздел'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_pickaxes'

  'Раздел талисманы':
    slots:
    - 29
    material: PAPER
    model_data_component:
