# ============================================================================
# Меню ивентов для DeluxeMenus (GeyserEvent v1.8.0)
# Файл: plugins/DeluxeMenus/gui_menus/events.yml
#
# Чтобы подключить это меню в plugins/DeluxeMenus/config.yml, добавьте:
# gui_menus:
#   events:
#     file: events.yml
# ============================================================================

menu_title: '&8Ивенты сервера'
open_command:
  - events
register_command: true
size: 54

items:
  # --------------------------------------------------------------------------
  # 1. Ивент «Адский Разлом (Вторжение Босса)»
  # --------------------------------------------------------------------------
  'infernal_rift':
    material: NETHERITE_AXE
    slot: 10
    hide_attributes: true
    hide_enchants: true
    display_name: '&c&lАдский Разлом &8(&cВторжение Босса&8)'
    lore:
      - '&8Анархический PvP/PvE ивент'
      - ''
      - '&e┠ &fНа карте открывается древняя цитадель Разлома,'
      - '&e┠ &fкоторую охраняет &c2-метровый Брутальный Пиглин&f.'
      - ''
      - '&6Особенности ивента:'
      - '&e┠ &fЗдоровье Босса: &c3500 ❤ &8(&fУрон: &c8 ед.&8)'
      - '&e┠ &fСпособности (15м): &6Притягивание, Отталкивание, Стяжка'
      - '&e┠ &fСтражи: &6Приспешники Разлома &fс ценным лутом'
      - '&e┠ &fДлительность: &620 минут'
      - ''
      - '&6Награды по урону:'
      - '&e┠ &61 место: &2+3000 осколков'
      - '&e┠ &f2 место: &2+2000 осколков'
      - '&e┠ &c3 место: &2+1000 осколков'
      - ''
      - '&2» Нажмите ЛКМ, чтобы узнать время (/event delay)'
      - '&6» Нажмите ПКМ, чтобы включить локатор (/event gps)'
    left_click_commands:
      - '[close]'
      - '[player] event delay'
    right_click_commands:
      - '[close]'
      - '[player] event gps'

  # --------------------------------------------------------------------------
  # 2. Ивент «Пляжные Раскопки»
  # --------------------------------------------------------------------------
  'beach_excavation':
    material: BRUSH
    slot: 12
    hide_attributes: true
    hide_enchants: true
    display_name: '&6&lПляжные Раскопки &8(&eАрхеолог&8)'
    lore:
      - '&8Ивент раскопок сокровищ (31x31)'
      - ''
      - '&e┠ &fВ мире появляется большой тропический пляж'
      - '&e┠ &fс пальмами, лагерями и залежами древнего песка.'
      - ''
      - '&6Особенности ивента:'
      - '&e┠ &fВ центре стоит &e2-метровый Житель-Археолог'
      - '&e┠ &fНажмите по Жителю, чтобы забрать готовую кисточку!'
      - '&e┠ &fВиды кисточек: &aОбычная &7(35%)&f, &dЭпическая &7(40%)&f, &6Легендарная &7(25%)'
      - '&e┠ &fПод конец ивента Житель выдаёт кисточки в &a4 раза быстрее&f!'
      - '&e┠ &fЛимит в инвентаре: &6до 3 кисточек &7(пропадают вне зоны)'
      - ''
      - '&2» Нажмите ЛКМ, чтобы узнать время (/event delay)'
      - '&6» Нажмите ПКМ, чтобы включить локатор (/event gps)'
    left_click_commands:
      - '[close]'
      - '[player] event delay'
    right_click_commands:
      - '[close]'
      - '[player] event gps'

  # --------------------------------------------------------------------------
  # 3. Ивент «Котёл Алхимика»
  # --------------------------------------------------------------------------
  'alchemist_cauldron':
    material: BREWING_STAND
    slot: 14
    hide_attributes: true
    hide_enchants: true
    display_name: '&d&lКотёл Алхимика &8(&dМистическое Болото&8)'
    lore:
      - '&8Алхимический ивент сбора реагентов (31x31)'
      - ''
      - '&e┠ &fСреди древнего болота возвышается готическая ротонда'
      - '&e┠ &fс бурлящими котлами и &d2-метровым Магистром Алхимиком&f.'
      - ''
      - '&6Особенности ивента:'
      - '&e┠ &fНа 16 пьедесталах болота растут &dНестабильные Реагенты&f:'
      - '&e┠ &aБолотный Спороцвет &7(35%) &8| &dКристалл Бездны &7(40%) &8| &6Сердце Пламени &7(25%)'
      - '&e┠ &fСрывайте реагенты и кликайте по &dАлхимику &fили &dКотлу&f,'
      - '&e┠ &fчтобы мгновенно сварить ценный предмет соответствующей редкости!'
      - '&e┠ &fПод конец ивента котёл закипает и реагенты растут каждые &a4 сек.&f!'
      - '&e┠ &fЛимит в инвентаре: &6до 3 реагентов &7(пропадают вне зоны)'
      - ''
      - '&2» Нажмите ЛКМ, чтобы узнать время (/event delay)'
      - '&6» Нажмите ПКМ, чтобы включить локатор (/event gps)'
    left_click_commands:
      - '[close]'
      - '[player] event delay'
    right_click_commands:
      - '[close]'
      - '[player] event gps'

  # --------------------------------------------------------------------------
  # 4. ПОСТОЯННЫЙ ИВЕНТ «Шахта Древних (Жила Жеод)» на 0 ~ 0
  # --------------------------------------------------------------------------
  'ancient_mine':
    material: ANVIL
    slot: 16
    hide_attributes: true
    hide_enchants: true
    display_name: '&6&lШахта Древних &8(&6Постоянный ивент 45x45&8)'
    lore:
      - '&8Постоянный карьер Древних Кузнецов (45x45)'
      - ''
      - '&e┠ &fРасположен постоянно в центре мира на &60 ~ 0&f!'
      - '&e┠ &fПри входе в карьер на вашей спине появляется'
      - '&e┠ &63D-Рюкзак Шахтёра &7(не мешает вашей броне!)&f.'
      - ''
      - '&6Особенности ивента:'
      - '&e┠ &fПри вскапывании руда и жеоды падают &eна пол'
      - '&e┠ &fПри смерти игрока вся его руда &cвыпадает на пол'
      - '&e┠ &fПрокачка рюкзака у Кузнеца: &aот 15 до 160 руды &7(Ур. 1-6)'
      - '&e┠ &fДревние жеоды: &aКварцевая &8| &dАметистовая &8| &6Магмовая'
      - '&e┠ &fОповещения об обновлении жилы пишутся в чат!'
      - ''
      - '&2» Нажмите ЛКМ, чтобы открыть меню Рюкзака (/event backpack)'
      - '&6» Нажмите ПКМ, чтобы включить локатор (/event gps)'
    left_click_commands:
      - '[close]'
      - '[player] event backpack'
    right_click_commands:
      - '[close]'
      - '[player] event gps'

  # --------------------------------------------------------------------------
  # Кнопка: Время до ивента (/event delay)
  # --------------------------------------------------------------------------
  'event_delay':
    material: CLOCK
    slot: 29
    display_name: '&2&lВремя до следующего ивента'
    lore:
      - '&7Проверка таймера авто-ивентов'
      - ''
      - '&e┠ &fПоказывает, сколько времени осталось'
      - '&e┠ &fдо появления следующего случайного ивента,'
      - '&e┠ &fлибо координаты уже активного ивента.'
      - ''
      - '&2» Нажмите, чтобы выполнить /event delay'
    left_click_commands:
      - '[close]'
      - '[player] event delay'
    right_click_commands:
      - '[close]'
      - '[player] event delay'

  # --------------------------------------------------------------------------
  # Кнопка: GPS-Локатор (/event gps)
  # --------------------------------------------------------------------------
  'event_gps':
    material: RECOVERY_COMPASS
    slot: 31
    display_name: '&6&lGPS-Локатор ивента'
    lore:
      - '&7Навигатор до активного ивента или Шахты (0 ~ 0)'
      - ''
      - '&e┠ &fВключает стрелку направления, расстояние в метрах'
      - '&e┠ &fи путеводные частицы до активного ивента в мире &eWorld2&f.'
      - '&e┠ &7(Если временного ивента нет — ведёт к Шахте Древних 0 ~ 0)'
      - ''
      - '&6» Нажмите, чтобы включить / выключить (/event gps)'
    left_click_commands:
      - '[close]'
      - '[player] event gps'
    right_click_commands:
      - '[close]'
      - '[player] event gps'

  # --------------------------------------------------------------------------
  # Кнопка: Закрыть меню
  # --------------------------------------------------------------------------
  'close_menu':
    material: BARRIER
    slot: 33
    display_name: '&c&lЗакрыть меню'
    lore:
      - '&7Нажмите, чтобы закрыть окно'
    left_click_commands:
      - '[close]'
    right_click_commands:
      - '[close]'

