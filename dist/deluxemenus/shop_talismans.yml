  'Талисман воина':
    slots:
    - 19
    material: TOTEM_OF_UNDYING
    model_data_component:
      floats: [6]
    display_name: '&cТалисман воина'
    lore:
      - ''
      - '&7Работает только в левой руке.'
      - ''
      - '&7Урон: &a+2'
      - '&7Броня: &a+4'
      - '&7Здоровье: &a+2'
      - ''
      - '&fЦена: &b650 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '650'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 650, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 650'
      - '[console] talisman give %player_name% crusher 1'
      - '[message] &aПокупка успешна: &cТалисман воина'
      - '[sound] ENTITY_PLAYER_LEVELUP'
