          output: '488'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 488, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 488'
