# DeluxeMenus — раздел: Донат
# Файл на сервере: plugins/DeluxeMenus/gui_menus/donate.yml
# Открывается командой /donate
#
# Покупка за осколки (PlayerPoints) в этом меню ОТКЛЮЧЕНА:
#  * привилегии не продаются за осколки — только за реальные деньги на сайте;
#  * выдачу привилегии делает плагин-магазин/администратор, а не DeluxeMenus;
#  * меню служит витриной: показывает возможности каждой привилегии.
#
# Группы LuckPerms (для справки): strannik, geroy, rycar, baron, lord, knyaz, imperator.
# Если снова понадобится покупка за осколки — верни блоки click_requirement
# и команды points take / lp user parent add.

