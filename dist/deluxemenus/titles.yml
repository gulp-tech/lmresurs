# DeluxeMenus — меню титулов VoidPE
# Файл в: plugins/DeluxeMenus/gui_menus/titles.yml
# Открытие: /titles
#
# Как это работает:
#  * Титулы выдаются ТОЛЬКО из кейса титулов (VoidCases): при выигрыше
#    кейс, помимо суффикса, выдаёт право titles.<id> в LuckPerms.
#    Ничего не продаётся и командами не выдаётся.
#  * Нажатие на титул проверяет право (has permission titles.<id>):
#    есть право — титул применяется суффиксом LuckPerms (setsuffix 90,
#    как ставит сам кейс и как читает VoidTab), нет — сообщение, что
#    титула нет.
#  * Кнопка «Очистить» (слот 26) убирает титул: meta removesuffix 90.

menu_title: '• Титулы'
open_command: titles
register_command: true
size: 27
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Титул Везунчик':
    slots:
    - 10
    material: NAME_TAG
    display_name: '&aВезунчик'
    lore:
      - ''
      - '&fТитул после ника в чате.'
      - '&7Шанс из кейса: &a33.1%'
      - ''
      - '&eВыбивается только из кейса титулов!'
      - '&eНажми, чтобы применить'
    click_requirement:
      requirements:
        owned:
          type: has permission
          permission: titles.vezunchik
      deny_commands:
        - '[message] &cУ тебя нет титула «Везунчик». Он выпадает только из кейса титулов.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] lp user %player_name% meta setsuffix 90 " &aВезунчик&r"'
      - '[message] &aТитул «Везунчик» применён! Теперь он после твоего ника.'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

